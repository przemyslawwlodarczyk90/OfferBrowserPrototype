version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin        # Ustawienie nazwy użytkownika
      MONGO_INITDB_ROOT_PASSWORD: admin123     # Ustawienie hasła użytkownika
    ports:
      - "27017:27017"                         # Mapowanie portów
    volumes:
      - mongodb_data:/data/db                 # Przechowywanie danych w wolumenie

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always                           # Restart kontenera w razie błędów
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/  # Wskazanie MongoDB jako hosta

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379          # Wskazanie Redis jako hosta
    ports:
      - "8082:8081"

  lotto:
    container_name: browser
    image: 135808915638.dkr.ecr.eu-north-1.amazonaws.com/browser1:latest  # Adres obrazu z ECR
    restart: always
    ports:
      - '8000:8000'
    environment:
      SPRING_APP_NAME: OfferBrowserPrototype
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_USER: admin
      MONGO_PASSWORD: admin123
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB_NAME: offer_browser_db
      MONGO_AUTH_SOURCE: admin
      SERVER_PORT: 8080
      JWT_SECRET: yourSuperSecretKeyThatIsAtLeast32CharactersLong
      JWT_ISSUER: offer-browser-prototype
      JWT_EXPIRATION: 3600000
      SPRINGDOC_API_DOCS_PATH: /v3/api-docs
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui.html
      SPRINGDOC_PACKAGES: com.example.offerbrowserprototype.infrastructure.web,com.example.userbridge.infrastructure.api
      PROVIDER_ONE_API_URL: https://api.providerone.com/job-offers

      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: userbridge9@gmail.com
      MAIL_PASSWORD: mnuv bxzq bvla oieg
      MAIL_SMTP_AUTH: "true"  # Poprawiona wartość
      MAIL_SMTP_STARTTLS: "true"  # Poprawiona wartość
      SPRING_TIMEZONE: UTC
      PYTHON_PATH: /usr/bin/python3
      PYTHON_SCRIPT_PATH: scripts/scraper.py
      PYTHON_OFFER_URL_SCRAPER: src/main/resources/scripts/scrape_offer_from_url.py

      DAILY_OFFERS_EMAIL_RECIPIENT: userbridge9@gmail.com

