spring.profiles.active=prod
# Sekrety (haslo bazy, JWT, SMTP, konto admina) - z pliku .env w folderze glownym (wzor: .env.example)
spring.config.import=optional:file:.env[.properties]

# ======================================================================
# HARMONOGRAM SCRAPEROW — tu ustawiasz godziny i przesuniecia
# ======================================================================
# Kazdy portal (No Fluff Jobs, theprotocol.it, Just Join IT) jest pobierany RAZ DZIENNIE (strefa Europe/Warsaw).
# Codziennie o 00:01 losowany jest plan dnia - dla kazdego portalu osobno:
#   1. jedna godzina z listy scraper.schedule.slots (nigdy ta sama co wczoraj),
#   2. przesunieta W PRZOD albo WSTECZ o jedna wartosc z listy scraper.schedule.offsets-minutes,
#   3. godziny wszystkich portali musza byc parami min. scraper.schedule.min-gap-minutes od siebie - inaczej losowanie od nowa.
# Plan dnia jest zapisywany w scraper.schedule.plan-file (restart w ciagu dnia go nie zmienia).
# Zmiany dzialaja od nastepnego losowania (00:01) - albo od razu, jesli usuniesz plik planu i zrestartujesz aplikacje.
#
# GODZINY (format HH:mm, jedna w linii, kazda linia poza ostatnia konczy sie przecinkiem i znakiem \).
# Sasiednie godziny powinny byc od siebie dalej niz 2 x najwieksze przesuniecie (2 x 17 = 34 min),
# inaczej przesuniete godziny roznych por moga sie pokrywac.
scraper.schedule.slots=\
  06:11,\
  06:53,\
  07:46,\
  08:27,\
  09:17,\
  10:04,\
  10:48,\
  11:39,\
  12:21,\
  13:13,\
  13:56,\
  14:44,\
  15:28,\
  16:23,\
  17:06,\
  17:52,\
  18:47,\
  19:31,\
  20:24,\
  21:18
#
# PRZESUNIECIA w minutach (dodatnie liczby) - kazde losowane w przod (+) albo wstecz (-), nigdy 0.
# Obecnie: -17, -15, -11, -7, -3, +3, +7, +11, +15, +17  ->  10 wariantow x 20 godzin = 200 mozliwych terminow.
# Przyklad: godzina 12:21 moze wypasc o 12:04, 12:06, 12:10, 12:14, 12:18, 12:24, 12:28, 12:32, 12:36 lub 12:38.
scraper.schedule.offsets-minutes=\
  3,\
  7,\
  11,\
  15,\
  17
#
# Minimalny odstep miedzy portalami w minutach (120 = 2 godziny).
scraper.schedule.min-gap-minutes=120
#
# Plik z planem dnia (wylosowane godziny + czy portal juz wystartowal).
scraper.schedule.plan-file=data/schedule/daily_plan.json
