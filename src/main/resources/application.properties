# ==========================
# Aplikacja OfferBrowserPrototype
# ==========================
spring.application.name=OfferBrowserPrototype

# ==========================
# Redis Cache Configuration
# ==========================
# W??czanie/wy??czanie cache Redis
spring.cache.type=redis
# Konfiguracja globalnego czasu wyga?ni?cia cache'a (w milisekundach)
spring.cache.redis.time-to-live=600000
# Redis Cache TTL dla ofert (opcjonalne, je?li potrzebne)
offer.cache.expiration=10

# ==========================
# Redis Configuration
# ==========================
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Opcjonalnie, je?li Redis wymaga uwierzytelnienia
# spring.data.redis.username=your_redis_username
# spring.data.redis.password=your_redis_password
# SSL dla Redis (opcjonalne, je?li u?ywane w ?rodowisku produkcyjnym)
# spring.data.redis.ssl=true

# ==========================
# MongoDB Configuration
# ==========================
spring.data.mongodb.uri=mongodb://admin:admin123@localhost:27017/offer_browser_db?authSource=admin&readPreference=primary

# ==========================
# Wykluczanie autokonfiguracji
# ==========================
# Wykluczanie klas autokonfiguracji JDBC, poniewa? aplikacja nie u?ywa relacyjnej bazy danych
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# ==========================
# Konfiguracja serwera
# ==========================
# Port, na którym dzia?a aplikacja
server.port=8080

# ==========================
# Logging Configuration
# ==========================
# Poziom logowania dla operacji MongoDB
logging.level.org.springframework.data.mongodb.core=DEBUG
# Logi Redis (opcjonalne, dla monitorowania dzia?ania)
logging.level.org.springframework.data.redis=DEBUG

# ==========================
# JWT Configuration
# ==========================
# Sekret u?ywany do podpisywania tokenów JWT
jwt.secret=yourSuperSecretKeyThatIsAtLeast32CharactersLong
# Wystawca tokena JWT
jwt.issuer=offer-browser-prototype
# Czas wyga?ni?cia tokena JWT (w milisekundach)
jwt.expiration-time-ms=3600000

# ==========================
# SpringDoc (Swagger) Configuration
# ==========================
# ?cie?ka do dokumentacji API
springdoc.api-docs.path=/v3/api-docs
# ?cie?ka do interfejsu Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
# Pakiety do skanowania dla Swaggera
springdoc.packages-to-scan=com.example.offerbrowserprototype.infrastructure.web,com.example.userbridge.infrastructure.api

# ==========================
# Provider API Configuration
# ==========================
# URL dla API zewn?trznego dostawcy ofert pracy
provider.one.api.url=https://api.providerone.com/job-offers

# ==========================
# Scheduling Configuration
# ==========================
# W??czanie/wy??czanie harmonogramowania zada?
spring.scheduling.enabled=true

# ==========================
# Scheduled Job Offer Fetcher
# ==========================
# W??czanie/wy??czanie schedulera dla pobierania ofert pracy
job.offer.scheduler.enabled=false
# Wyra?enie cron dla schedulera (domy?lnie: co godzin?)
job.offer.scheduler.cron=0 0 * * * *

# ==========================
# Spring Mail Configuration
# ==========================
# Konfiguracja SMTP do wysy?ania e-maili (rejestracja i codzienne powiadomienia)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=userbridge9@gmail.com
spring.mail.password=mnuv bxzq bvla oieg
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================
# Jackson Configuration
# ==========================
# Strefa czasowa u?ywana przez Jacksona
spring.jackson.time-zone=UTC

# ==========================
# Python Configuration
# ==========================
# ?cie?ka do interpretera Pythona (dla ?rodowiska deweloperskiego na Windows)
python.path=C:/Users/przem/AppData/Local/Programs/Python/Python313/python.exe
# ?cie?ka do skryptu Pythona (classpath: resources/scripts/scraper.py)
python.script.path=scripts/scraper.py
# ?cie?ka do skryptu Python odpowiedzialnego za pobieranie szczegó?ów oferty z podanego URL
python.script.offer-url-scraper=src/main/resources/scripts/scrape_offer_from_url.py

# ==========================
# Python Script Scheduler
# ==========================
# W??czanie/wy??czanie harmonogramowania skryptu Pythona
python.script.scheduler.enabled=true
# Wyra?enie cron dla harmonogramu (codziennie o 6:00, 12:00, 18:00, 23:00)
python.script.scheduler.cron=0 0 6,12,18,23 * * *

# ==========================
# Daily Offers Email Scheduler
# ==========================
# W??czanie/wy??czanie codziennego wysy?ania wiadomo?ci o niezaplikowanych ofertach
daily.offers.email.enabled=true
# Wyra?enie cron dla harmonogramu (codziennie o godzinie 17:00)
daily.unapplied.offers.cron=0 0 17 * * *  
# Adres e-mail odbiorcy codziennych powiadomie?
daily.offers.email.recipient=userbridge9@gmail.com
