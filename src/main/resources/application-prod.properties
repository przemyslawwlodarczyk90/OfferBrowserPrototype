# ===============================
# APP
# ===============================
spring.application.name=OfferBrowserPrototype
server.port=8081

# ===============================
# DATABASE - POSTGRES
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===============================
# REDIS
# ===============================
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=600000
offer.cache.expiration=10

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.issuer=offer-browser-prototype
jwt.expiration-time-ms=3600000

# ===============================
# MAIL
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=false

# ===============================
# PYTHON SCRIPTS
# ===============================
python.path=python
# skrypty kazdego portalu leza w osobnym podfolderze: scripts/nofluff, scripts/theprotocol, scripts/justjoin

# ===============================
# SCRAPERS (per portal)
# ===============================
# Harmonogram scraperow (godziny, przesuniecia, odstep): patrz application.properties


# Adresy wyszukiwania (listy ofert) kazdego portalu sa w bazie (tabela scraper_search_urls)
# i edytuje je administrator: Panel admina -> Adresy wyszukiwania scraperow.

# No Fluff Jobs: Selenium + Chrome
scraper.nofluff.script=scripts/nofluff/scraper.py
scraper.nofluff.offer-script=scripts/nofluff/scrape_offer_from_url.py
scraper.nofluff.scrape-on-schedule=true
scraper.nofluff.file=data/offers/detailed_offers.json
scraper.nofluff.timeout-minutes=120

# theprotocol.it: HTTP + JSON (__NEXT_DATA__), bez przegladarki
scraper.theprotocol.enabled=true
scraper.theprotocol.scrape-on-schedule=true
scraper.theprotocol.script=scripts/theprotocol/scrape_theprotocol.py
scraper.theprotocol.offer-script=scripts/theprotocol/scrape_theprotocol_offer.py
scraper.theprotocol.file=data/offers/theprotocol_offers.json
scraper.theprotocol.timeout-minutes=50

# Just Join IT: HTTP + dane strony Next.js (self.__next_f), bez przegladarki
scraper.justjoin.enabled=true
scraper.justjoin.scrape-on-schedule=true
scraper.justjoin.script=scripts/justjoin/scrape_justjoin.py
scraper.justjoin.offer-script=scripts/justjoin/scrape_justjoin_offer.py
scraper.justjoin.file=data/offers/justjoin_offers.json
scraper.justjoin.timeout-minutes=50
# limit czasu pobierania pojedynczej oferty z URL (wszystkie portale)
scraper.offer-timeout-seconds=120

# ===============================
# CV UZYTKOWNIKOW
# ===============================
# Folder, w ktorym zapisywane sa pliki CV (w bazie, w users.cv_url, jest tylko sciezka do pliku).
# "." = folder glowny aplikacji (katalog, z ktorego jest uruchamiana). Zmiana dotyczy nowych plikow.
cv.storage.dir=.
cv.max-size-mb=10

# ===============================
# KOPIA ZAPASOWA BAZY (JSON)
# ===============================
# Folder na kopie calej bazy (Panel admina -> Kopia zapasowa bazy). Domyslnie "backups" w folderze glownym aplikacji.
backup.dir=backups

# Limit wysylanych plikow: kopie bazy moga byc duze; limit CV pilnuje osobno cv.max-size-mb
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=201MB

# ===============================
# SCHEDULING
# ===============================
spring.scheduling.enabled=true
job.offer.scheduler.cron=0 0 * * * *
job.offer.scheduler.enabled=false
daily.unapplied.offers.cron=0 0 17 * * *

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=true

# ===============================
# JACKSON / TIMEZONE
# ===============================
spring.jackson.time-zone=UTC

# ===============================
# SWAGGER
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.example.offerbrowserprototype.infrastructure.web

# ===============================
# CORS / BASE URL
# ===============================
app.cors.allowed-origin=http://localhost:8081.
app.server.base-url=http://localhost:8081
# DEV: http://localhost:8081 (frontend serwowany przez backend) lub http://localhost:3000 (npm run dev)
# PROD: zmień na publiczny URL serwera, np. http://ec2-16-171-116-191.eu-north-1.compute.amazonaws.com:8080
app.frontend.base-url=http://localhost:8081


# ===============================
# ADMIN SEEDER
# ===============================
app.admin.username=${ADMIN_USERNAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.data.redis=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.hibernate.SQL=DEBUG
