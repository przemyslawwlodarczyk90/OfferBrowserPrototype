# ===============================
# APP
# ===============================
spring.application.name=OfferBrowserPrototype
server.port=8081

# ===============================
# DATABASE - POSTGRES
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/pgDB
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===============================
# REDIS
# ===============================
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=600000
offer.cache.expiration=10

# ===============================
# JWT
# ===============================
jwt.secret=yourSuperSecretKeyThatIsAtLeast32CharactersLong
jwt.issuer=offer-browser-prototype
jwt.expiration-time-ms=3600000

# ===============================
# MAIL
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=userbridge9@gmail.com
spring.mail.password=mnuv bxzq bvla oieg
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=false

# ===============================
# PYTHON SCRIPTS
# ===============================
python.path=python
python.script.path=scripts/scraper.py
python.script.offer-url-scraper=src/main/resources/scripts/scrape_offer_from_url.py
python.script.scheduler.url=http://localhost:8080/api/python-script/run
python.script.scheduler.cron=0 0 6,12,18,23 * * *
python.script.scheduler.enabled=false

# ===============================
# SCHEDULING
# ===============================
spring.scheduling.enabled=true
job.offer.scheduler.cron=0 0 * * * *
job.offer.scheduler.enabled=false
daily.unapplied.offers.cron=0 0 17 * * *

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=true

# ===============================
# JACKSON / TIMEZONE
# ===============================
spring.jackson.time-zone=UTC

# ===============================
# SWAGGER
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.example.offerbrowserprototype.infrastructure.web

# ===============================
# CORS / BASE URL
# ===============================
app.cors.allowed-origin=http://localhost:3000
app.server.base-url=http://localhost:8081
# DEV: http://localhost:3000 (Vite dev server)
# PROD: zmień na publiczny URL serwera, np. http://ec2-16-171-116-191.eu-north-1.compute.amazonaws.com:8080
app.frontend.base-url=http://localhost:3000


# ===============================
# ADMIN SEEDER
# ===============================
app.admin.username=admin
app.admin.email=admin@ofp.local
app.admin.password=Admin123!

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.data.redis=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.hibernate.SQL=DEBUG
