<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Daily Job Offers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
        }
        .email-container {
            background-color: #ffffff;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
        }
        .email-header {
            text-align: center;
            padding-bottom: 20px;
        }
        .offer-item {
            margin: 10px 0;
        }
        .applied-button {
            display: inline-block;
            padding: 10px 15px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
        .applied-button.applied {
            background-color: #28a745; /* Zielony dla "Applied" */
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="email-header">
        <h1>Your Daily Unapplied Job Offers</h1>
    </div>
    <div class="email-body">
        <h2>Here are your daily unapplied job offers</h2>
        <div th:each="offer : ${offers}" class="offer-item">
            <p th:text="${offer.title}"></p>
            <a th:href="@{'http://localhost:8080/api/offers/' + ${offer.id} + '/apply'}"
               class="applied-button"
               target="_blank">Apply</a>
        </div>
    </div>
</div>
</body>
</html>
