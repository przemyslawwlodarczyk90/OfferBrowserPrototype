<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Daily Job Offers</title>
    <style>
        body {
            font-family: "Roboto", Arial, sans-serif;
            line-height: 1.6;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        .email-container {
            background-color: #1e1e1e;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        .email-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        .email-header h1 {
            color: #64ffda;
        }
        .email-body {
            margin-top: 20px;
        }
        .offer-item {
            margin: 15px 0;
            padding: 10px;
            background-color: #2a2a2a;
            border-radius: 8px;
            border: 1px solid #333;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }
        .offer-item:hover {
            transform: scale(1.02);
            background-color: #333;
        }
        .offer-item p {
            margin: 0 0 10px;
            font-size: 14px;
        }
        .offer-item a {
            text-decoration: none;
            color: #64ffda;
            word-break: break-word;
        }
        .offer-item span {
            color: #64ffda;
        }

        .applied-button {
            display: inline-block;
            padding: 10px 15px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .applied-button:hover {
            background-color: #0056b3;
        }
        .applied-button.applied {
            background-color: #ff5252;
            cursor: not-allowed;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #757575;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="email-header">
        <h1>Your Daily Unapplied Job Offers</h1>
    </div>
    <div class="email-body">
        <h2 style="color: #64ffda; text-align: center;">Here are your daily unapplied job offers</h2>
        <div th:if="${offers.isEmpty()}">
            <p style="text-align: center; color: #e0e0e0;">No unapplied offers available at the moment.</p>
        </div>
        <div th:each="offer, iterStat : ${offers}" class="offer-item" th:if="${!offers.isEmpty()}">
            <p>
                Offer <span th:text="${iterStat.index + 1}"></span>:
                <a th:href="${offer.offerUrl}" th:text="${offer.offerUrl}" target="_blank"></a>
            </p>
            <a th:href="@{'http://localhost:8080/api/user-offers/' + ${offer.id} + '/apply'}"
               th:attr="data-userId=${userId}"
               th:class="${offer.applied} ? 'applied-button applied' : 'applied-button'"
               target="_blank">Apply</a>
        </div>
    </div>
    <footer>
        <p>Generated by OfferBrowser Prototype &copy; 2025</p>
    </footer>
</div>
</body>
</html>
