<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Daily Job Offers</title>
    <style>
        /* (stylizacja bez zmian) */
    </style>
</head>
<body>
<div class="email-container">
    <div class="email-header">
        <h1>Your Daily Unapplied Job Offers</h1>
    </div>
    <div class="email-body">
        <h2 style="color: #64ffda; text-align: center;">Here are your daily unapplied job offers</h2>

        <div th:if="${offers.isEmpty()}">
            <p style="text-align: center; color: #e0e0e0;">No unapplied offers available at the moment.</p>
        </div>
        <div th:each="offer, iterStat : ${offers}" class="offer-item">
            <span class="offer-index" th:text="${iterStat.index + 1}">1</span>
            <div>
                <p>
                    Offer URL:
                    <a th:href="${offer.offerUrl}" th:text="${offer.offerUrl}" target="_blank"></a>
                </p>
                <a th:href="${baseUrl + '/api/user-offers/' + ${offer.id} + '/apply?email=' + ${email}}"
                   class="apply-button">
                    Apply
                </a>
            </div>
        </div>
    </div>
    <footer>
        <p>Generated by OfferBrowser Prototype &copy; 2025</p>
    </footer>
</div>
</body>
</html>
