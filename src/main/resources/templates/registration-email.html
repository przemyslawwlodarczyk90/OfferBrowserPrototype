<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirm Your Registration</title>
    <style>
        body {
            font-family: "Roboto", Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
        }

        .email-container {
            background-color: #1e1e1e;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .email-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .email-header h1 {
            color: #64ffda;
        }

        .email-body {
            padding: 20px 0;
            text-align: center; /* Wycentrowanie treści i guzika */
        }

        .email-body p {
            margin-bottom: 20px;
        }

        .btn-confirm {
            display: inline-block;
            padding: 12px 20px;
            margin: 20px auto;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-confirm:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .email-footer {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #757575;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="email-header">
        <h1>Welcome to Our Service</h1>
    </div>
    <div class="email-body">
        <p>Dear <span th:text="${username}"></span>,</p>
        <p>Thank you for registering with us. Please click the button below to confirm your registration:</p>
        <a th:href="${confirmationLink}" class="btn-confirm">Confirm Registration</a>
    </div>
    <div class="email-footer">
        <p>If you did not register for this account, please ignore this email.</p>
        <p>Generated by OfferBrowser Prototype &copy; 2025</p>
    </div>
</div>
</body>
</html>
